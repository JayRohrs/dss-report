# One entry per fixture file: which unknown it probes (Q1-Q9 are defined in README.md), what the file is, what the
# reader does with it TODAY (checked by tests/test_dss_matrix.py), and what a REAL R365 export must show to settle
# the unknown. Every file is invented ("Sample ..." places, made-up amounts, no ids). None is a copy of a real export.


[[fixture]]
file = "pair_classic.csv"
probes = ["Q2"]
what = "Classic list for one business day (2026-03-13): 5 places, 3 Approved, 2 Unapproved. Half of a same-day pair."
reader_today = "Reads Hill Bistro and Park Diner as not approved. The brief lists those two."
settled_by = "A real classic export of the SAME day, downloaded at about the same time as a real beta export. Keep both."

[[fixture]]
file = "pair_beta_lines_up.csv"
probes = ["Q2"]
what = "Beta list for the same day and places as pair_classic.csv, written as if 'In Progress' means 'Unapproved'. A pretend result, not a real one."
reader_today = "Shows the two 'In Progress' places as 'Could not tell'. With the owner's per-connection word set to 'not approved' the brief matches the classic one exactly."
settled_by = "Place by place, every classic 'Unapproved' row shows 'In Progress' in the beta file and every 'Approved' row shows 'Approved'. Count rows that match and rows that do not."

[[fixture]]
file = "pair_beta_does_not_line_up.csv"
probes = ["Q2", "Q7"]
what = "Same day and places as pair_classic.csv, but the beta words do not follow the classic ones: one 'Completed' where classic says Unapproved, one 'In Progress' where classic says Approved. A pretend result."
reader_today = "Never treats a word as a yes or no unless the owner set it. If the owner sets 'In Progress = not approved' the brief then differs from the classic brief (Mill Tavern appears, Hill Bistro does not). That is the risk of setting it before checking."
settled_by = "Any single place whose classic and beta words disagree with the assumed mapping. Also what 'Completed' means for a day that is not yet approved."

[[fixture]]
file = "over_short_signs_classic.csv"
probes = ["Q1"]
what = "Classic list, one place, six days, all Unapproved: -23.5000, 23.5000, (23.50), 23.50-, 0.0000, -0.0000."
reader_today = "Reads each number correctly, shows the number 'as R365 gives it', never writes 'over' or 'short', and marks the sign as not known."
settled_by = "One entry where the till really was short by a known amount (and one really over), and which sign R365's file shows for each. Two known cases settle it."

[[fixture]]
file = "over_short_signs_beta.csv"
probes = ["Q1", "Q2"]
what = "Beta list, same day: -23.5000 and 23.5000 on unfinished days and -23.5000 on an approved day."
reader_today = "An approved day with a cash difference is not listed in the brief; the two unfinished days are 'Could not tell'. Numbers are read with their signs."
settled_by = "Same as above, from the beta list, so both layouts are known to use the same sign."

